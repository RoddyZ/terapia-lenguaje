name: CI

on:
  pull_request:
    branches: [develop, staging, main]
  push:
    branches: [develop, staging]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Lint · Typecheck · Test · Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm run lint
      - run: npm run format:check
      - run: npm run test:coverage
      - name: Build (modo según rama destino)
        run: |
          if [ "${{ github.base_ref || github.ref_name }}" = "main" ]; then npm run build; else npm run build:staging; fi

  changeset:
    name: Changeset presente
    if: github.event_name == 'pull_request' && github.base_ref == 'develop' && !startsWith(github.head_ref, 'changeset-release/')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - uses: actions/setup-node@v4
        with:
          node-version-file: .nvmrc
          cache: npm
      - run: npm ci
      - name: Verificar changeset
        run: npx changeset status --since=origin/develop
